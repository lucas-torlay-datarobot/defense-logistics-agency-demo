[project]
name = "dla-agent"
version = "0.1.0"
description = "Grounded natural-language analytics for the synthetic DLA demo"
requires-python = ">=3.11,<3.14"
dependencies = ["duckdb>=1.4,<2", "sqlglot>=26,<30", "httpx>=0.28,<1", "pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dla_agent"]
