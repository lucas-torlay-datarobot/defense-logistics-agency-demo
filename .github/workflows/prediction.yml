name: Prediction checks
on:
  push:
    paths: ['prediction/**', 'scripts/**', '.github/workflows/prediction.yml']
  pull_request:
    paths: ['prediction/**', 'scripts/**', '.github/workflows/prediction.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e './prediction[dev]'
      - run: python -m ruff check prediction scripts
      - run: python -m ruff format --check prediction scripts
      - run: python -m pytest prediction/tests -q
