name: Application checks
on:
  push:
    paths: ['agent/**', 'fastapi_server/**', 'frontend_web/**', 'prediction/**', 'scripts/**', '.github/workflows/application.yml']
  pull_request:
    paths: ['agent/**', 'fastapi_server/**', 'frontend_web/**', 'prediction/**', 'scripts/**', '.github/workflows/application.yml']
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e './prediction[dev]' -e ./agent -e './fastapi_server[dev]'
      - run: python -m ruff check agent fastapi_server scripts
      - run: python -m ruff format --check agent fastapi_server scripts
      - run: python -m pytest fastapi_server/tests prediction/tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend_web/package-lock.json
      - run: npm --prefix frontend_web ci
      - run: npm --prefix frontend_web run format:check
      - run: npm --prefix frontend_web test
      - run: npm --prefix frontend_web run build
