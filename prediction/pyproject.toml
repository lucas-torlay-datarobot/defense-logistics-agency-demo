[project]
name = "dla-prediction"
version = "0.1.0"
description = "Synthetic DLA shortage-risk demonstration on DataRobot"
requires-python = ">=3.11,<3.14"
dependencies = [
  "datarobot>=3.19,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "python-dotenv>=1,<2",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dla_prediction"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
