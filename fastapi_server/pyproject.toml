[project]
name = "dla-api"
version = "0.1.0"
description = "DLA demo API and React application host"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
